<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: black;
      }

      #vr-wrapper {
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: relative;
      }

      #vr-container {
        display: flex;
        flex-direction: row;
        aspect-ratio: 2 / 1;
        height: 100%;
        width: auto;
        background: black;
        overflow: hidden;
      }

      #vr-container a-scene {
        flex: 1;
        height: 100%;
        overflow: hidden;
      }

      #vr-container a-scene:first-child {
        transform: translateX(2.929%);
        clip-path: inset(0 2.929% 0 2.929%);
      }

      #vr-container a-scene:last-child {
        transform: translateX(-2.929%);
        clip-path: inset(0 2.929% 0 2.929%);
      }

      @media (max-width: 768px) {
        #vr-container {
          flex-direction: column;
          aspect-ratio: auto;
          height: 100%;
          width: auto;
        }

        #vr-container a-scene {
          width: 100%;
          height: 50%;
        }
      }

      #tapToStart {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        font-size: 1.5rem;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        cursor: pointer;
      }
    </style>
  </head>

  <body style="margin:0; padding:0; overflow:hidden; height:100vh; width:100vw;">
    <div id="tapToStart">▶️ Tap to Start VR Video</div>

    <div id="vr-wrapper">
      <div id="vr-container">
        <a-scene embedded vr-mode-ui="enabled: false" ar-mode-ui="enabled: false">
          <a-videosphere src="#vid360" rotation="0 180 0"></a-videosphere>
          <a-camera position="0 0 0" look-controls="touchEnabled: false; mouseEnabled: false"></a-camera>
        </a-scene>
        <a-scene embedded vr-mode-ui="enabled: false" ar-mode-ui="enabled: false">
          <a-videosphere src="#vid360" rotation="0 180 0"></a-videosphere>
          <a-camera position="0 0 0" look-controls="touchEnabled: false; mouseEnabled: false"></a-camera>
        </a-scene>
      </div>
    </div>

    <video
      id="vid360"
      src="https://media.githubusercontent.com/media/moshidrafts/myk/main/public/m1.mp4"
      playsinline
      webkit-playsinline
      autoplay
      loop
      muted
      crossorigin="anonymous"
      style="display:none;"
    ></video>

    <script>
      const video = document.getElementById('vid360');
      const tapOverlay = document.getElementById('tapToStart');

      // Try autoplay immediately
      video.play().then(() => {
        tapOverlay.style.display = 'none';
      }).catch(() => {
        // Autoplay blocked → require user tap
        tapOverlay.style.display = 'flex';
      });

      tapOverlay.addEventListener('click', () => {
        video.play().then(() => {
          tapOverlay.style.display = 'none';
          video.muted = false;
          video.volume = 1.0;
        }).catch(err => {
          console.error('Playback failed after tap:', err);
        });
      });
    </script>
  </body>
</html>
