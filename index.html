<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: black;
      }

      #vr-wrapper {
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: relative;
      }

      #vr-container {
        display: flex;
        flex-direction: row;
        aspect-ratio: 2 / 1;
        height: 100%;
        width: auto;
        background: black;
        overflow: hidden;
      }

      #vr-container a-scene {
        flex: 1;
        height: 100%;
        overflow: hidden;
      }

      #vr-container a-scene:first-child {
        transform: translateX(2.929%);
        clip-path: inset(0 2.929% 0 2.929%);
      }

      #vr-container a-scene:last-child {
        transform: translateX(-2.929%);
        clip-path: inset(0 2.929% 0 2.929%);
      }

      @media (max-width: 768px) {
        #vr-container {
          flex-direction: column;
          aspect-ratio: auto;
          height: 100%;
          width: auto;
        }

        #vr-container a-scene {
          width: 100%;
          height: 50%;
        }
      }
    </style>
  </head>

  <body style="margin:0; padding:0; overflow:hidden; height:100vh; width:100vw;">
    <div id="vr-wrapper">
      <div id="vr-container">
        <a-scene embedded vr-mode-ui="enabled: false" ar-mode-ui="enabled: false">
          <a-videosphere src="#vid360" rotation="0 90 0"></a-videosphere>
          <a-camera position="0 0 0" look-controls="touchEnabled: false; mouseEnabled: false"></a-camera>
        </a-scene>
        <a-scene embedded vr-mode-ui="enabled: false" ar-mode-ui="enabled: false">
          <a-videosphere src="#vid360" rotation="0 90 0"></a-videosphere>
          <a-camera position="0 0 0" look-controls="touchEnabled: false; mouseEnabled: false"></a-camera>
        </a-scene>
      </div>
    </div>

    <video id="vid360"
      autoplay loop playsinline webkit-playsinline crossorigin="anonymous" muted
      style="display:none;">
    </video>

    <script>
      const video = document.getElementById('vid360');
      const videoSrc = 'https://stream.mux.com/r9uNfQUUoa2lKvxHxBkgha1FG1sErKCezp8Av15tPSU.m3u8'; // Hindi video

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        video.play();
      } else {
        video.src = videoSrc;
        video.play();
      }
    </script>
  </body>
</html>
