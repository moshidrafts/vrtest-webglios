<script>
  window.dataLayer = window.dataLayer || [];

  const video = document.getElementById('vid360');
  const overlay = document.getElementById('language-overlay');
  const btnHindi = document.getElementById('btn-hindi');
  const btnMalayalam = document.getElementById('btn-malayalam');

  // Progressive MP4 sources (replace these with your actual mp4 URLs)
  const sourcesByLang = {
    hi: 'https://corah-two.vercel.app/idc.mp4',
    ml: 'https://myk-alpha.vercel.app/m1_progressive.mp4'
  };

  function startPlaybackForLanguage(langKey) {
    const mp4Src = sourcesByLang[langKey];
    if (!mp4Src) return;

    // GA4 TRACKING
    dataLayer.push({
      event: 'language_selected',
      language_choice: langKey === 'hi' ? 'Hindi' : 'Malayalam'
    });

    // Try to lock orientation
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    overlay.style.display = 'none';

    // Ensure autoplay works
    video.muted = true;
    video.src = mp4Src;

    video.addEventListener('loadeddata', () => {
      video.play().then(() => {
        video.muted = false;
        video.volume = 1.0;
      }).catch(err => {
        console.error('Playback failed:', err);
      });
    }, { once: true });
  }

  // GA4 COMPLETION TRACKING
  let hasCompleted = false;

  video.addEventListener('timeupdate', function() {
    if (video.duration > 0 && (video.duration - video.currentTime < 0.5) && !hasCompleted) {
      hasCompleted = true;
      console.log('Video playback has completed (timeupdate)!');
      dataLayer.push({ event: 'video_completed' });
    }
  });

  video.addEventListener('ended', function() {
    if (!hasCompleted) {
      hasCompleted = true;
      console.log('Video playback has completed (ended)!');
      dataLayer.push({ event: 'video_completed' });
    }
  });

  video.addEventListener('play', function() {
    if (video.currentTime < 1) {
      hasCompleted = false;
    }
  });

  btnHindi.onclick = () => startPlaybackForLanguage('hi');
  btnMalayalam.onclick = () => startPlaybackForLanguage('ml');
</script>
